name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 development libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-4-dev libfontconfig1-dev pkg-config xvfb dbus-x11
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Check session process replacement
        run: cargo run --locked --no-default-features --example session-boundary
      - name: Check native GTK workflows
        run: |
          cargo build --locked
          xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=cairo G_DEBUG=fatal-criticals target/debug/safeincloud-linux --smoke-test
      - name: Build release
        run: cargo build --locked --release
