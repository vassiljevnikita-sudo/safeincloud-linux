[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeincloud-linux"
version = "0.5.0"
description = "Experimental native Linux SafeInCloud password editor with Google Drive"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["cryptography>=43", "defusedxml>=0.7.1", "dnfile>=0.17", "dncil>=1.0", "PySide6>=6.8,<7"]

[project.scripts]
safeincloud-linux = "safeincloud_linux.__main__:main"

[tool.setuptools.packages.find]
include = ["safeincloud_linux*"]

[tool.setuptools.package-data]
safeincloud_linux = ["assets/*.svg", "assets/fonts/*.ttf", "assets/fonts/*OFL.txt"]
