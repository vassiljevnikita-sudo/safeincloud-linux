[package]
name = "safeincloud-linux"
version = "1.0.0"
edition = "2021"
rust-version = "1.92"
description = "Native Rust and GTK4 SafeInCloud client for Linux"
license = "MIT"
repository = "https://github.com/vassiljevnikita-sudo/safeincloud-linux"
readme = "README.md"
exclude = ["legacy/", "work/", "build/", "dist/"]

[lib]
name = "safeincloud_linux"
path = "src/lib.rs"

[[bin]]
name = "safeincloud-linux"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:gtk"]

[dependencies]
anyhow = "1"
aes = { version = "0.8", features = ["zeroize"] }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
dotnetdll = "0.3"
flate2 = "1"
gtk = { package = "gtk4", version = "0.11", features = ["v4_8"], optional = true }
hex = "0.4"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "gif", "webp"] }
libc = "0.2"
md-5 = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
url = "2"
webbrowser = "1"
xmltree = "0.11"
xml-rs = "0.8"
zeroize = { version = "1", features = ["derive"] }
zxcvbn = "3.1"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
